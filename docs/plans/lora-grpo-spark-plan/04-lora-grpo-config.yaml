# GRPO config for run_grpo_math.py on DGX Spark (GB10, 130 GB HBM)
# NemotronH 30B-A3B — Megatron backend (train + generate), CPU optimizer offload.
# Single GPU (no TP/PP/EP), full-parameter training (no LoRA in megatron path).
#
# Memory budget (estimated):
#   Weights BF16:           ~60 GB
#   Gradients BF16 (peak):  ~60 GB
#   Activations (ckpt):     ~3 GB
#   CUDA context + misc:    ~5 GB
#   Total peak:            ~128 GB  ← fits in 130.7 GB HBM
#   Optimizer (CPU RAM):   ~180 GB  ← fits in 512 GB system RAM
#   KV cache (generation):  ~8 GB  ← freed during training phase

cluster:
  num_nodes: 1
  gpus_per_node: 1

# ── GRPO algorithm ─────────────────────────────────────────────────────────────
grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4       # train_global_batch_size = 4 * 4 = 16
  max_rollout_turns: 1
  max_num_epochs: 1
  max_num_steps: 300                  # override to 3 via CLI for smoke test
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 100
  val_at_start: false
  max_val_samples: 8
  val_batch_size: 4
  seed: 42
  overlong_filtering: false
  use_dynamic_sampling: true
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1
  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: 1024
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1

# ── Loss function ──────────────────────────────────────────────────────────────
loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28               # asymmetric DAPO clipping
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  truncated_importance_sampling_ratio: null
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: false

# ── Checkpointing ──────────────────────────────────────────────────────────────
checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-spark"    # overridden at runtime via CLI
  metric_name: null
  higher_is_better: true
  keep_top_k: 3
  save_period: 50
  checkpoint_must_save_by: null
  model_save_format: "safetensors"
  save_consolidated: false
  async_save: false
  fully_parallel_save: false

# ── Policy ─────────────────────────────────────────────────────────────────────
policy:
  model_name: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
  tokenizer:
    name: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
    chat_template_kwargs: null
  hf_config_overrides: {}
  train_global_batch_size: 16          # num_prompts * num_generations = 4 * 4
  train_micro_batch_size: 1
  generation_batch_size: 4             # only used for megatron generation batching
  logprob_batch_size: 1
  max_total_sequence_length: 1024      # reduce from 4096 to save KV cache memory
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false  # colocated gen always offloads; no-op here
  max_grad_norm: 1.0

  # DTensor disabled — using Megatron backend
  dtensor_cfg:
    enabled: false

  # Pytorch optimizer/scheduler null — Megatron has its own in megatron_cfg
  optimizer: null
  scheduler: null

  dynamic_batching:
    enabled: false
    train_mb_tokens: 1024
    logprob_mb_tokens: 1024
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: 1024              # max_total_sequence_length * train_micro_batch_size
    logprob_mb_tokens: 1024
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: 1

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1       # frees GPU mem between rollout and training
    activation_checkpointing: true     # essential for fitting 30B backward in 130 GB
    converter_type: "NemotronHForCausalLM"
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    pipeline_dtype: "bfloat16"
    sequence_parallel: false
    # MoE router stability flags (critical for NemotronH)
    freeze_moe_router: true
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    apply_rope_fusion: true
    bias_activation_fusion: true
    defer_fp32_logits: false
    moe_per_layer_logging: false
    env_vars: null

    optimizer:
      optimizer: "adam"
      lr: 1.0e-6
      min_lr: 1.0e-7
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: 1.0
      optimizer_cpu_offload: true      # offload Adam states to CPU RAM (180 GB)
      optimizer_offload_fraction: 1.0  # must be 1.0 when cpu_offload is true

    scheduler:
      start_weight_decay: 0.01
      end_weight_decay: 0.01
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 300
      lr_warmup_iters: 5
      lr_warmup_init: 1.0e-7

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    fp8_cfg: null

  generation:
    backend: "megatron"                # in-process generation using training weights
    max_new_tokens: 256                # short for smoke test; increase for full run
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    mcore_generation_config:
      buffer_size_gb: 8               # KV cache allocation; reduce if OOM
      buffer_guaranteed_fraction: 0.1
      num_cuda_graphs: 4
      block_size_tokens: 256
      use_cuda_graphs_for_non_decode_steps: false
      enable_chunked_prefill: true
    colocated:
      enabled: true                    # megatron generation always shares training GPU
      resources:
        gpus_per_node: null
        num_nodes: null

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  dataset_name: "ResponseDataset"
  train_data_path: "/workspace/data/v0.9_grpo_train.jsonl"
  val_data_path: "/workspace/data/v0.9_grpo_valid.jsonl"
  input_key: "prompt"
  output_key: "answer"
  max_input_seq_length: 1024
  shuffle: true
  num_workers: 1
  prompt_file: null
  system_prompt_file: null

# ── Environment ────────────────────────────────────────────────────────────────
env:
  math:
    num_workers: 2
    math_verify_impl: "hf_math_verify"
  dapo:
    num_workers: 2
    math_verify_impl: "dapo_math_verify"

# ── Logging ────────────────────────────────────────────────────────────────────
logger:
  log_dir: "results/grpo-spark/logs"  # overridden at runtime via CLI
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "grpo-spark"
    name: "nemotronh-30b-spark"
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-spark"
    run_name: "nemotronh-30b-spark"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
